# NOTE: `plan: free` is a single instance (no horizontal scaling, and it
# sleeps on inactivity). The auth, CORS, and rate-limit hardening added to
# backend/security.py assumes exactly this: the rate limiter and dataset
# cleanup task keep their state in-process. If this is ever moved to a
# multi-instance plan, the rate limiter needs a shared store (e.g. Redis)
# instead of its current in-memory dict — that migration is out of scope here.
services:
  - type: web
    name: querymind-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM
        value: groq
      - key: API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: UPLOAD_TTL_SECONDS
        value: "86400"
